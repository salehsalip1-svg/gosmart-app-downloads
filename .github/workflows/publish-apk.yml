name: Publish verified Android download
on:
  push:
    paths: ['.github/workflows/publish-apk.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Expo artifact
        run: |
          curl --fail --location --retry 3 'https://expo.dev/artifacts/eas/4pv77GdpUCTSoXxrOXaUegYMg_cIFa_TZeNzKExfIh8.apk' -o GO-SMART-1.1.1.apk
          echo 'e2a56b49ccda4ed9aab4e03c4d6c58c7db980076a499f3b19299a2991b845676  GO-SMART-1.1.1.apk' | sha256sum --check
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-v1.1.1 GO-SMART-1.1.1.apk --repo salehsalip1-svg/gosmart-app-downloads --clobber
