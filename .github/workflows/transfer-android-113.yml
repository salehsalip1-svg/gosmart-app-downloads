name: Transfer verified Android 1.1.3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify APK
        run: |
          curl --fail --location --retry 3 'https://expo.dev/artifacts/eas/y9a1sWRCrcP6aW1_B2KKi06xU_arI4Y0BNLrcqicJXg.apk' -o GO-SMART-1.1.3.apk
          echo 'd2435699dcd3cf05024ce3a6a6c995d3914dd16672a1545a33556703503c3f7b  GO-SMART-1.1.3.apk' | sha256sum --check
      - name: Publish testing APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create android-v1.1.3 GO-SMART-1.1.3.apk --title 'GO SMART Android 1.1.3' --prerelease --notes 'Testing release. Package com.gosmarteg.smarthome, versionCode 4. APK signature and certificate match checked. Device installation and notification delivery need testing. SHA256: d2435699dcd3cf05024ce3a6a6c995d3914dd16672a1545a33556703503c3f7b'